<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사용 일정 달력</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .view-toggle {
            display: flex;
            gap: 5px;
            background: white;
            border-radius: 8px;
            padding: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .view-toggle button {
            padding: 8px 16px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .view-toggle button.active {
            background: #667eea;
            color: white;
        }

        .current-date {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
        }

        .calendar-view {
            padding: 30px;
        }

        /* 월별 뷰 */
        .month-view {
            display: none;
        }

        .month-view.active {
            display: block;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .day-header {
            text-align: center;
            padding: 15px;
            font-weight: 700;
            background: #f8f9fa;
            border-radius: 8px;
            color: #495057;
        }

        .day-header.sunday { color: #dc3545; }
        .day-header.saturday { color: #007bff; }

        .day-cell {
            min-height: 120px;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .day-cell:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .day-cell.other-month {
            background: #f8f9fa;
            opacity: 0.5;
        }

        .day-cell.today {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .day-cell.holiday {
            background: #fff5f5;
        }

        .day-number {
            font-weight: 700;
            font-size: 1.1em;
            margin-bottom: 8px;
            color: #333;
        }

        .day-cell.sunday .day-number { color: #dc3545; }
        .day-cell.saturday .day-number { color: #007bff; }

        .event-item {
            font-size: 0.75em;
            padding: 4px 6px;
            margin: 3px 0;
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: all 0.2s;
        }

        .event-item:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .event-item.completed {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .event-normal {
            background: #d4edff;
            color: #0056b3;
            border-left: 3px solid #007bff;
        }

        .event-holiday {
            background: #ffe5e5;
            color: #c92a2a;
            border-left: 3px solid #dc3545;
        }

        .event-ongoing {
            background: #d4f4dd;
            color: #1e7e34;
            border-left: 3px solid #28a745;
        }

        /* 주별 뷰 */
        .week-view {
            display: none;
        }

        .week-view.active {
            display: block;
        }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .week-day {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            min-height: 300px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .week-day:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .week-day.today {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .week-day-header {
            font-weight: 700;
            font-size: 1.2em;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }

        /* 일별 뷰 */
        .day-view {
            display: none;
        }

        .day-view.active {
            display: block;
        }

        .day-detail {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-top: 20px;
            border: 2px solid #e9ecef;
        }

        .day-detail h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #333;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
        }

        .event-list {
            margin-top: 20px;
        }

        .event-list-item {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #007bff;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .event-list-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .event-list-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .event-list-item.holiday-type {
            border-left-color: #dc3545;
            background: #fff5f5;
        }

        .event-list-item.ongoing-type {
            border-left-color: #28a745;
            background: #f1f9f3;
        }

        .event-info {
            flex: 1;
        }

        .event-title {
            font-weight: 700;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .event-date-range {
            font-size: 0.9em;
            color: #6c757d;
        }

        .event-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 5px 12px;
            font-size: 0.85em;
        }

        /* 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 20px;
            color: #333;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: flex-end;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .no-events {
            text-align: center;
            padding: 40px;
            color: #6c757d;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .calendar-grid,
            .week-grid {
                grid-template-columns: repeat(7, 1fr);
                gap: 5px;
            }

            .day-cell {
                min-height: 80px;
                padding: 5px;
            }

            .event-item {
                font-size: 0.65em;
                padding: 2px 4px;
            }

            .controls {
                flex-direction: column;
            }

            .week-day {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 교사용 일정 달력</h1>
            <p>효율적인 학사 일정 관리</p>
        </div>

        <div class="controls">
            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="navigate('prev')">◀ 이전</button>
                <button class="btn btn-secondary" onclick="navigate('today')">오늘</button>
                <button class="btn btn-secondary" onclick="navigate('next')">다음 ▶</button>
            </div>

            <div class="current-date" id="currentDate"></div>

            <div class="view-toggle">
                <button class="active" onclick="changeView('month')">월별</button>
                <button onclick="changeView('week')">주별</button>
                <button onclick="changeView('day')">일별</button>
            </div>

            <div class="nav-buttons">
                <button class="btn btn-success" onclick="openEventModal()">+ 일정 추가</button>
                <button class="btn btn-primary" onclick="openHolidayModal()">+ 휴일 추가</button>
            </div>
        </div>

        <div class="calendar-view">
            <div class="month-view active" id="monthView"></div>
            <div class="week-view" id="weekView"></div>
            <div class="day-view" id="dayView"></div>
        </div>
    </div>

    <!-- 일정 추가 모달 -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">일정 추가</div>
            <form id="eventForm">
                <div class="form-group">
                    <label>일정 제목 *</label>
                    <input type="text" id="eventTitle" required>
                </div>
                <div class="form-group">
                    <label>시작일 *</label>
                    <input type="date" id="eventStartDate" required>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="isOngoing">
                    <label>연속 일정</label>
                </div>
                <div class="form-group" id="endDateGroup" style="display:none;">
                    <label>종료일</label>
                    <input type="date" id="eventEndDate">
                </div>
                <div class="form-group">
                    <label>설명 (선택)</label>
                    <textarea id="eventDescription"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('eventModal')">취소</button>
                    <button type="submit" class="btn btn-success">추가</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 휴일 추가 모달 -->
    <div class="modal" id="holidayModal">
        <div class="modal-content">
            <div class="modal-header">휴일 추가</div>
            <form id="holidayForm">
                <div class="form-group">
                    <label>휴일 이름 *</label>
                    <input type="text" id="holidayTitle" required>
                </div>
                <div class="form-group">
                    <label>날짜 *</label>
                    <input type="date" id="holidayDate" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('holidayModal')">취소</button>
                    <button type="submit" class="btn btn-primary">추가</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 전역 변수
        let currentDate = new Date();
        let currentView = 'month';
        let events = [];
        let holidays = [];

        // 로컬스토리지에서 데이터 로드
        function loadFromStorage() {
            const savedEvents = localStorage.getItem('teacherCalendarEvents');
            const savedHolidays = localStorage.getItem('teacherCalendarHolidays');

            if (savedEvents) events = JSON.parse(savedEvents);
            if (savedHolidays) holidays = JSON.parse(savedHolidays);
        }

        // 로컬스토리지에 데이터 저장
        function saveToStorage() {
            localStorage.setItem('teacherCalendarEvents', JSON.stringify(events));
            localStorage.setItem('teacherCalendarHolidays', JSON.stringify(holidays));
        }

        // 초기화
        function init() {
            loadFromStorage();
            updateCurrentDateDisplay();
            renderCalendar();
            setupEventListeners();
        }

        // 이벤트 리스너 설정
        function setupEventListeners() {
            document.getElementById('isOngoing').addEventListener('change', function() {
                document.getElementById('endDateGroup').style.display = this.checked ? 'block' : 'none';
            });

            document.getElementById('eventForm').addEventListener('submit', function(e) {
                e.preventDefault();
                addEvent();
            });

            document.getElementById('holidayForm').addEventListener('submit', function(e) {
                e.preventDefault();
                addHoliday();
            });
        }

        // 날짜 표시 업데이트
        function updateCurrentDateDisplay() {
            const dateStr = currentView === 'month' 
                ? `${currentDate.getFullYear()}년 ${currentDate.getMonth() + 1}월`
                : currentView === 'week'
                ? `${currentDate.getFullYear()}년 ${currentDate.getMonth() + 1}월 ${getWeekOfMonth(currentDate)}주차`
                : `${currentDate.getFullYear()}년 ${currentDate.getMonth() + 1}월 ${currentDate.getDate()}일`;

            document.getElementById('currentDate').textContent = dateStr;
        }

        // 주차 계산
        function getWeekOfMonth(date) {
            const firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
            const firstDayOfWeek = firstDay.getDay();
            const offsetDate = date.getDate() + firstDayOfWeek - 1;
            return Math.floor(offsetDate / 7) + 1;
        }

        // 네비게이션
        function navigate(direction) {
            if (direction === 'prev') {
                if (currentView === 'month') {
                    currentDate.setMonth(currentDate.getMonth() - 1);
                } else if (currentView === 'week') {
                    currentDate.setDate(currentDate.getDate() - 7);
                } else {
                    currentDate.setDate(currentDate.getDate() - 1);
                }
            } else if (direction === 'next') {
                if (currentView === 'month') {
                    currentDate.setMonth(currentDate.getMonth() + 1);
                } else if (currentView === 'week') {
                    currentDate.setDate(currentDate.getDate() + 7);
                } else {
                    currentDate.setDate(currentDate.getDate() + 1);
                }
            } else if (direction === 'today') {
                currentDate = new Date();
            }

            updateCurrentDateDisplay();
            renderCalendar();
        }

        // 뷰 변경
        function changeView(view) {
            currentView = view;

            document.querySelectorAll('.view-toggle button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            document.getElementById('monthView').classList.remove('active');
            document.getElementById('weekView').classList.remove('active');
            document.getElementById('dayView').classList.remove('active');

            document.getElementById(view + 'View').classList.add('active');

            updateCurrentDateDisplay();
            renderCalendar();
        }

        // 달력 렌더링
        function renderCalendar() {
            if (currentView === 'month') {
                renderMonthView();
            } else if (currentView === 'week') {
                renderWeekView();
            } else {
                renderDayView();
            }
        }

        // 월별 뷰 렌더링
        function renderMonthView() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const prevLastDay = new Date(year, month, 0);

            const firstDayOfWeek = firstDay.getDay();
            const lastDate = lastDay.getDate();
            const prevLastDate = prevLastDay.getDate();

            let html = '';

            // 요일 헤더
            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            dayNames.forEach((day, index) => {
                const className = index === 0 ? 'sunday' : index === 6 ? 'saturday' : '';
                html += `<div class="day-header ${className}">${day}</div>`;
            });

            // 이전 달 날짜
            for (let i = firstDayOfWeek - 1; i >= 0; i--) {
                const date = prevLastDate - i;
                html += createDayCell(new Date(year, month - 1, date), true);
            }

            // 현재 달 날짜
            for (let date = 1; date <= lastDate; date++) {
                html += createDayCell(new Date(year, month, date), false);
            }

            // 다음 달 날짜
            const remainingCells = 42 - (firstDayOfWeek + lastDate);
            for (let date = 1; date <= remainingCells; date++) {
                html += createDayCell(new Date(year, month + 1, date), true);
            }

            document.getElementById('monthView').innerHTML = `<div class="calendar-grid">${html}</div>`;
        }

        // 일 셀 생성
        function createDayCell(date, isOtherMonth) {
            const today = new Date();
            const isToday = date.toDateString() === today.toDateString();
            const dayOfWeek = date.getDay();
            const dateStr = formatDate(date);

            const dayEvents = getEventsForDate(date);
            const isHoliday = holidays.some(h => h.date === dateStr);

            let className = 'day-cell';
            if (isOtherMonth) className += ' other-month';
            if (isToday) className += ' today';
            if (dayOfWeek === 0) className += ' sunday';
            if (dayOfWeek === 6) className += ' saturday';
            if (isHoliday) className += ' holiday';

            let eventsHtml = '';
            dayEvents.slice(0, 3).forEach(event => {
                const eventClass = event.type === 'holiday' ? 'event-holiday' : 
                                  event.isOngoing ? 'event-ongoing' : 'event-normal';
                const completedClass = event.completed ? 'completed' : '';
                eventsHtml += `<div class="event-item ${eventClass} ${completedClass}" onclick="viewEvent('${event.id}')">${event.title}</div>`;
            });

            if (dayEvents.length > 3) {
                eventsHtml += `<div class="event-item" style="background:#e9ecef; color:#495057;">+${dayEvents.length - 3}개 더</div>`;
            }

            return `
                <div class="${className}" onclick="selectDate('${dateStr}')">
                    <div class="day-number">${date.getDate()}</div>
                    ${eventsHtml}
                </div>
            `;
        }

        // 주별 뷰 렌더링
        function renderWeekView() {
            const startOfWeek = new Date(currentDate);
            startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());

            let html = '<div class="week-grid">';

            for (let i = 0; i < 7; i++) {
                const date = new Date(startOfWeek);
                date.setDate(startOfWeek.getDate() + i);

                const today = new Date();
                const isToday = date.toDateString() === today.toDateString();
                const dateStr = formatDate(date);
                const dayEvents = getEventsForDate(date);

                const dayNames = ['일', '월', '화', '수', '목', '금', '토'];

                let eventsHtml = '';
                dayEvents.forEach(event => {
                    const eventClass = event.type === 'holiday' ? 'event-holiday' : 
                                      event.isOngoing ? 'event-ongoing' : 'event-normal';
                    const completedClass = event.completed ? 'completed' : '';
                    eventsHtml += `<div class="event-item ${eventClass} ${completedClass}" onclick="viewEvent('${event.id}')">${event.title}</div>`;
                });

                html += `
                    <div class="week-day ${isToday ? 'today' : ''}" onclick="selectDate('${dateStr}')">
                        <div class="week-day-header">${dayNames[i]} ${date.getDate()}일</div>
                        ${eventsHtml || '<div class="no-events" style="padding:20px;">일정 없음</div>'}
                    </div>
                `;
            }

            html += '</div>';
            document.getElementById('weekView').innerHTML = html;
        }

        // 일별 뷰 렌더링
        function renderDayView() {
            const dateStr = formatDate(currentDate);
            const dayEvents = getEventsForDate(currentDate);

            const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

            let html = `
                <div class="day-detail">
                    <h2>${currentDate.getMonth() + 1}월 ${currentDate.getDate()}일 ${dayNames[currentDate.getDay()]}</h2>
                    <div class="event-list">
            `;

            if (dayEvents.length === 0) {
                html += '<div class="no-events">등록된 일정이 없습니다.</div>';
            } else {
                dayEvents.forEach(event => {
                    const typeClass = event.type === 'holiday' ? 'holiday-type' : 
                                     event.isOngoing ? 'ongoing-type' : '';
                    const completedClass = event.completed ? 'completed' : '';

                    let dateRange = event.startDate;
                    if (event.isOngoing && event.endDate) {
                        dateRange += ` ~ ${event.endDate}`;
                    }

                    html += `
                        <div class="event-list-item ${typeClass} ${completedClass}">
                            <div class="event-info">
                                <div class="event-title">${event.title}</div>
                                <div class="event-date-range">${dateRange}</div>
                                ${event.description ? `<div style="margin-top:5px; color:#6c757d;">${event.description}</div>` : ''}
                            </div>
                            <div class="event-actions">
                                ${event.type !== 'holiday' ? `
                                    <button class="btn btn-${event.completed ? 'secondary' : 'success'} btn-small" 
                                            onclick="toggleComplete('${event.id}')">
                                        ${event.completed ? '미완료' : '완료'}
                                    </button>
                                ` : ''}
                                <button class="btn btn-secondary btn-small" onclick="deleteEvent('${event.id}')">삭제</button>
                            </div>
                        </div>
                    `;
                });
            }

            html += '</div></div>';
            document.getElementById('dayView').innerHTML = html;
        }

        // 특정 날짜의 이벤트 가져오기
        function getEventsForDate(date) {
            const dateStr = formatDate(date);
            const result = [];

            // 휴일 추가
            holidays.forEach(holiday => {
                if (holiday.date === dateStr) {
                    result.push({
                        id: holiday.id,
                        title: holiday.title,
                        type: 'holiday',
                        startDate: holiday.date,
                        date: holiday.date
                    });
                }
            });

            // 일반 이벤트 추가
            events.forEach(event => {
                if (event.isOngoing) {
                    const start = new Date(event.startDate);
                    const end = new Date(event.endDate);
                    const current = new Date(dateStr);

                    if (current >= start && current <= end) {
                        result.push(event);
                    }
                } else {
                    if (event.startDate === dateStr) {
                        result.push(event);
                    }
                }
            });

            return result;
        }

        // 날짜 선택
        function selectDate(dateStr) {
            currentDate = new Date(dateStr);
            changeView('day');
        }

        // 일정 추가 모달 열기
        function openEventModal(dateStr = null) {
            document.getElementById('eventModal').classList.add('active');
            document.getElementById('eventForm').reset();

            if (dateStr) {
                document.getElementById('eventStartDate').value = dateStr;
            } else {
                document.getElementById('eventStartDate').value = formatDate(currentDate);
            }
        }

        // 휴일 추가 모달 열기
        function openHolidayModal(dateStr = null) {
            document.getElementById('holidayModal').classList.add('active');
            document.getElementById('holidayForm').reset();

            if (dateStr) {
                document.getElementById('holidayDate').value = dateStr;
            } else {
                document.getElementById('holidayDate').value = formatDate(currentDate);
            }
        }

        // 모달 닫기
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // 일정 추가
        function addEvent() {
            const title = document.getElementById('eventTitle').value;
            const startDate = document.getElementById('eventStartDate').value;
            const isOngoing = document.getElementById('isOngoing').checked;
            const endDate = isOngoing ? document.getElementById('eventEndDate').value : startDate;
            const description = document.getElementById('eventDescription').value;

            if (!title || !startDate) {
                alert('필수 항목을 입력해주세요.');
                return;
            }

            if (isOngoing && !endDate) {
                alert('종료일을 입력해주세요.');
                return;
            }

            const event = {
                id: Date.now().toString(),
                title,
                startDate,
                endDate,
                isOngoing,
                description,
                completed: false,
                type: 'event'
            };

            events.push(event);
            saveToStorage();
            closeModal('eventModal');
            renderCalendar();
        }

        // 휴일 추가
        function addHoliday() {
            const title = document.getElementById('holidayTitle').value;
            const date = document.getElementById('holidayDate').value;

            if (!title || !date) {
                alert('필수 항목을 입력해주세요.');
                return;
            }

            const holiday = {
                id: Date.now().toString(),
                title,
                date,
                type: 'holiday'
            };

            holidays.push(holiday);
            saveToStorage();
            closeModal('holidayModal');
            renderCalendar();
        }

        // 완료 토글
        function toggleComplete(eventId) {
            const event = events.find(e => e.id === eventId);
            if (event) {
                event.completed = !event.completed;
                saveToStorage();
                renderCalendar();
            }
        }

        // 이벤트 삭제
        function deleteEvent(eventId) {
            if (!confirm('정말 삭제하시겠습니까?')) return;

            events = events.filter(e => e.id !== eventId);
            holidays = holidays.filter(h => h.id !== eventId);

            saveToStorage();
            renderCalendar();
        }

        // 이벤트 보기
        function viewEvent(eventId) {
            const event = [...events, ...holidays].find(e => e.id === eventId);
            if (event) {
                currentDate = new Date(event.startDate || event.date);
                changeView('day');
            }
        }

        // 날짜 포맷
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 모달 외부 클릭 시 닫기
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        }

        // 초기화 실행
        init();
    </script>
</body>
</html>
